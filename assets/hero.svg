<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" width="100%" role="img" aria-label="Yarfer - backend and systems engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="55%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <filter id="blurA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <g>
    <rect width="1180" height="330" rx="16" fill="url(#bg)"/>
    <rect width="1180" height="330" rx="16" fill="url(#grid)" opacity="0.32"/>
    <circle cx="90" cy="20" r="150" fill="#22d3ee" opacity="0.13" filter="url(#blurA)"/>
    <circle cx="1080" cy="300" r="170" fill="#a78bfa" opacity="0.14" filter="url(#blurA)"/>
    <rect x="0.5" y="0.5" width="1179" height="329" rx="16" fill="none" stroke="#1e2b45"/>

    <!-- header -->
    <text x="44" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="42" font-weight="700" fill="url(#name)">Yarfer</text>
    <text x="214" y="71" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#7d8ba3">/ backend · systems · reverse engineering</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#9fb0c9">
      <rect x="756" y="44" width="120" height="26" rx="13" fill="#0f1729" stroke="#24334d"/>
      <circle cx="774" cy="57" r="4" fill="#34d399">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="786" y="61">open to work</text>
      <rect x="884" y="44" width="112" height="26" rx="13" fill="#0f1729" stroke="#24334d"/>
      <text x="898" y="61">python · rust</text>
      <rect x="1004" y="44" width="136" height="26" rx="13" fill="#0f1729" stroke="#24334d"/>
      <text x="1018" y="61">tg bots · fastapi</text>
    </g>
  </g>

  <!-- terminal -->
  <g>
    <rect x="40" y="98" width="1100" height="196" rx="12" fill="#080d16" stroke="#22314c"/>
    <rect x="40" y="98" width="1100" height="30" rx="12" fill="#0e1626"/>
    <rect x="40" y="116" width="1100" height="12" fill="#0e1626"/>
    <path d="M40 128h1100" stroke="#1b2740" stroke-width="1"/>
    <circle cx="62" cy="113" r="5" fill="#ff5f57"/>
    <circle cx="80" cy="113" r="5" fill="#febc2e"/>
    <circle cx="98" cy="113" r="5" fill="#28c840"/>
    <text x="1114" y="117" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#5b6b85">bash — 80×24</text>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
      <!-- 1 -->
      <g clip-path="url(#c1)">
        <text x="64" y="152" fill="#e6edf3"><tspan fill="#34d399">yarfer@gh</tspan><tspan fill="#5b6b85">:~$</tspan> whoami</text>
      </g>
      <!-- 2 -->
      <g clip-path="url(#c2)">
        <text x="64" y="174" fill="#c3cede">Yarfer — backend &amp; systems engineer. Python &amp; Rust.</text>
      </g>
      <!-- 3 -->
      <g clip-path="url(#c3)">
        <text x="64" y="196" fill="#e6edf3"><tspan fill="#34d399">yarfer@gh</tspan><tspan fill="#5b6b85">:~$</tspan> cat focus.txt</text>
      </g>
      <!-- 4 -->
      <g clip-path="url(#c4)">
        <text x="64" y="218" fill="#c3cede">fastapi · postgres · redis · aiogram · react — and rust when speed matters</text>
      </g>
      <!-- 5 -->
      <g clip-path="url(#c5)">
        <text x="64" y="240" fill="#e6edf3"><tspan fill="#34d399">yarfer@gh</tspan><tspan fill="#5b6b85">:~$</tspan> echo $MOTTO</text>
      </g>
      <!-- 6 -->
      <g clip-path="url(#c6)">
        <text x="64" y="262" fill="#8b98ab">ship it, then make it fast.</text>
      </g>
      <!-- prompt -->
      <text x="64" y="284"><tspan fill="#34d399">yarfer@gh</tspan><tspan fill="#5b6b85">:~$ </tspan><tspan fill="#22d3ee">▊<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.15s" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>

  <!-- typing clips -->
  <defs>
    <clipPath id="c1"><rect x="60" y="138" width="330" height="20"><animate attributeName="width" from="0" to="330" dur="0.55s" begin="0.2s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="60" y="160" width="640" height="20"><animate attributeName="width" from="0" to="640" dur="1.05s" begin="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="60" y="182" width="360" height="20"><animate attributeName="width" from="0" to="360" dur="0.6s" begin="2.15s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="60" y="204" width="880" height="20"><animate attributeName="width" from="0" to="880" dur="1.4s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="60" y="226" width="330" height="20"><animate attributeName="width" from="0" to="330" dur="0.55s" begin="4.45s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="60" y="248" width="270" height="20"><animate attributeName="width" from="0" to="270" dur="0.75s" begin="5.15s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- accent rule -->
  <rect x="40" y="314" width="520" height="2" rx="1" fill="url(#line)"/>
</svg>
