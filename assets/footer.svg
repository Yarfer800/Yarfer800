<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 96" width="100%" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="fbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.6" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ftext" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1180" height="96" rx="16" fill="url(#fbg)"/>
  <circle cx="590" cy="96" r="140" fill="#a78bfa" opacity="0.12" filter="url(#fglow)"/>
  <rect x="0.5" y="0.5" width="1179" height="95" rx="16" fill="none" stroke="#1e2b45"/>

  <rect x="180" y="26" width="820" height="1.5" rx="1" fill="url(#fbar)"/>
  <text x="590" y="56" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8b98ab">built with python, rust &amp; too much coffee</text>
  <text x="590" y="78" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="url(#ftext)" opacity="0.85">thanks for stopping by ✦</text>
</svg>
